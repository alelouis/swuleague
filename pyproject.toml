[project]
name = "swuleague"
version = "0.1.0"
description = "Générateur d'images de classement pour ligues Star Wars Unlimited"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "Pillow>=10.0",
    "tzdata>=2026.5",
]

[tool.setuptools]
py-modules = ["image", "data", "drawing", "theme", "app", "melee", "parse_melee"]

[project.scripts]
swuleague = "image:main"
